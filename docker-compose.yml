version: "3.8"

services:
  # ─── Data Lake Services ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: security_minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: security_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: /init-buckets.sh
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro

  nessie:
    image: projectnessie/nessie:latest
    container_name: security_nessie
    ports:
      - "${NESSIE_PORT:-19120}:19120"
    environment:
      - NESSIE_VERSION_STORE_TYPE=IN_MEMORY
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── Visualization & Serving ────────────────────────────────────────
  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: security_superset
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}
      - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER:-admin}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  cubejs:
    image: cubejs/cube:latest
    container_name: security_cubejs
    ports:
      - "${CUBEJS_PORT:-4000}:4000"
    environment:
      - CUBEJS_DB_TYPE=duckdb
      - CUBEJS_DB_DUCKDB_DATABASE_PATH=/cube/data/security_analytics.duckdb
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET:-your-cubejs-api-secret}
      - CUBEJS_DEV_MODE=true
      - CUBEJS_EXTERNAL_DEFAULT=true
    volumes:
      - ./cube/schema:/cube/conf/schema
      - ./cube/cube.js:/cube/conf/cube.js
      - ./data:/cube/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─── Orchestration ──────────────────────────────────────────────────
  dagster-webserver:
    build:
      context: .
      dockerfile: dagster_pipeline/Dockerfile
    container_name: security_dagster_webserver
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    environment:
      - DAGSTER_HOME=/app/dagster_home
    volumes:
      - ./data:/app/data
      - ./mock_data:/app/mock_data
      - ./dbt_project:/app/dbt_project
      - dagster_home:/app/dagster_home
    command:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - dagster_pipeline/workspace.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  dagster-daemon:
    build:
      context: .
      dockerfile: dagster_pipeline/Dockerfile
    container_name: security_dagster_daemon
    environment:
      - DAGSTER_HOME=/app/dagster_home
    volumes:
      - ./data:/app/data
      - ./mock_data:/app/mock_data
      - ./dbt_project:/app/dbt_project
      - dagster_home:/app/dagster_home
    command:
      - dagster-daemon
      - run
      - -w
      - dagster_pipeline/workspace.yaml
    depends_on:
      dagster-webserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  superset_home:
  dagster_home:
  minio_data:
