[project]
name = "security-incident-analytics-platform"
version = "0.1.0"
description = "AI-Powered Security Incident Analytics Platform"
requires-python = ">=3.11"
dependencies = [
    "faker>=22.5.1",
    "numpy>=1.26.4",
    "pydantic>=2.6.1",
    "dlt>=0.4.12",
    "dbt-duckdb>=1.7.4",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "dagster>=1.6.10",
    "dagster-webserver>=1.6.10",
    "dagster-dbt>=0.22.10",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.1",
    "joblib>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.98.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.1",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mock_data*", "dlt_pipeline*", "ml_detection*", "dagster_pipeline*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
]
